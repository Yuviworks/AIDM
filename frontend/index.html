<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AIDM - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <h1 class="fw-bold">
                            AIDM
                        </h1>

                        <p class="text-muted">
                            AI-Based Predictive Maintenance
                        </p>

                    </div>

                    <!-- LOGIN -->

                    <div id="loginSection">

                        <h4 class="mb-3">
                            Login
                        </h4>

                        <form id="loginForm">

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="loginEmail"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="loginPassword"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Login
                            </button>

                        </form>

                        <div id="loginMessage" class="mt-3"></div>

                        <div class="text-center mt-3">

                            <span>
                                Don't have an account?
                            </span>

                            <button
                                class="btn btn-link"
                                id="showRegister"
                            >
                                Register
                            </button>

                        </div>

                    </div>


                    <!-- REGISTER -->

                    <div id="registerSection" style="display: none;">

                        <h4 class="mb-3">
                            Create Account
                        </h4>

                        <form id="registerForm">

                            <div class="mb-3">

                                <label class="form-label">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="registerName"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="registerEmail"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="registerPassword"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Create Account
                            </button>

                        </form>

                        <div id="registerMessage" class="mt-3"></div>

                        <div class="text-center mt-3">

                            <span>
                                Already have an account?
                            </span>

                            <button
                                class="btn btn-link"
                                id="showLogin"
                            >
                                Login
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>


<script src="js/login.js"></script>

</body>
</html>
