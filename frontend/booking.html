<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AIDM - Book Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            AIDM
        </span>

        <a
            href="dashboard.html"
            class="btn btn-outline-light btn-sm"
        >
            ← Dashboard
        </a>

    </div>

</nav>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    <!-- =========================
                         TITLE
                    ========================= -->

                    <h2 class="fw-bold mb-2">
                        Book Maintenance Service
                    </h2>

                    <p class="text-muted mb-4">
                        Review the service details and confirm
                        your appointment with the AIDM Booking Agent.
                    </p>



                    <!-- =========================
                         SELECTED SERVICE CENTER
                    ========================= -->

                    <div class="card bg-light border-0 mb-4">

                        <div class="card-body">

                            <h5 class="fw-bold mb-3">
                                📍 Selected Service Center
                            </h5>


                            <p
                                id="serviceCenterName"
                                class="fw-bold mb-1"
                            >
                                Loading...
                            </p>


                            <p
                                id="serviceCenterLocation"
                                class="mb-1"
                            >
                            </p>


                            <p
                                id="serviceCenterPhone"
                                class="mb-1"
                            >
                            </p>


                            <p
                                id="serviceCenterAvailability"
                                class="text-muted mb-0"
                            >
                            </p>

                        </div>

                    </div>



                    <!-- =========================
                         APPLIANCE
                    ========================= -->

                    <div class="mb-4">

                        <h5 class="fw-bold mb-3">
                            🔧 Appliance
                        </h5>


                        <div id="applianceInfo">

                            <div class="text-muted">
                                Loading...
                            </div>

                        </div>

                    </div>



                    <!-- =========================
                         BOOKING FORM
                    ========================= -->

                    <form id="bookingForm">


                        <!-- =========================
                             SERVICE DATE
                        ========================= -->

                        <div class="mb-4">

                            <label
                                for="bookingDate"
                                class="form-label fw-bold"
                            >
                                Select Service Date
                            </label>


                            <input
                                type="date"
                                id="bookingDate"
                                class="form-control"
                                required
                            >

                        </div>



                        <!-- =========================
                             USER CONFIRMATION
                        ========================= -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="confirmationCheckbox"
                            >


                            <label
                                class="form-check-label"
                                for="confirmationCheckbox"
                            >
                                I confirm that I want to book this
                                maintenance service.
                            </label>

                        </div>



                        <!-- =========================
                             BOOK BUTTON
                        ========================= -->

                        <button
                            type="submit"
                            id="bookButton"
                            class="btn btn-primary w-100"
                        >
                            🤖 Confirm & Book with AIDM Agent
                        </button>


                    </form>



                    <!-- =========================
                         BOOKING MESSAGE
                    ========================= -->

                    <div
                        id="bookingMessage"
                        class="mt-4"
                    >
                    </div>


                </div>

            </div>

        </div>

    </div>

</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/booking.js"></script>


</body>

</html>
